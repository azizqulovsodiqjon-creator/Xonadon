name: Keep Render awake

# Render's free tier puts the app to sleep after ~15 minutes with no
# traffic - the NEXT visitor then has to wait through a slow cold
# start (30-60s+), which looks/feels like the site "froze". Pinging
# the site regularly keeps it warm so real visitors never hit that
# cold start.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production site
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" --max-time 60 https://xonadon.onrender.com/ || true
